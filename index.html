<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>游戏屋</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="site-header">
    <div class="container">
      <div class="header-top">
        <div class="site-brand">
          <img class="site-logo" src="images/logo-dog.png" alt="小狗图标">
          <h1 class="site-name" id="site-name">游戏屋</h1>
        </div>
        <div class="header-right">
          <input type="text" class="search-box" id="search-box" placeholder="搜索…">
        </div>
      </div>
      <p class="announcement" id="announcement"></p>
      <nav class="section-bar" id="section-bar"></nav>
      <nav class="category-bar" id="category-bar"></nav>
    </div>
  </header>

  <main class="container">
    <section class="game-grid" id="game-grid"></section>
    <p class="empty-tip" id="empty-tip" hidden>没有符合条件的项目</p>
    <nav class="pagination" id="pagination" hidden></nav>
  </main>

  <div class="modal" id="detail-modal" hidden>
    <div class="modal-backdrop" id="modal-backdrop"></div>
    <div class="modal-panel">
      <button class="modal-close" id="modal-close">&times;</button>
      <div class="modal-body" id="modal-body">
        <div class="modal-cover" id="modal-cover" hidden>
          <img id="modal-cover-img" alt="封面" title="点击放大">
        </div>
        <div class="modal-gallery">
          <img id="gallery-main" alt="" hidden>
          <div class="gallery-placeholder" id="gallery-empty">暂无截图</div>
          <button class="gallery-nav gallery-prev" id="gallery-prev" hidden>&#8249;</button>
          <button class="gallery-nav gallery-next" id="gallery-next" hidden>&#8250;</button>
        </div>
        <div class="gallery-thumbs" id="gallery-thumbs" hidden></div>
        <div class="modal-info" id="modal-info"></div>
      </div>
      <button class="detail-add" id="detail-add-btn"></button>
    </div>
  </div>

  <!-- 图片放大浏览（小窗） -->
  <div class="lightbox" id="lightbox" hidden>
    <div class="lightbox-backdrop" id="lightbox-backdrop"></div>
    <div class="lightbox-panel" id="lightbox-panel">
      <img class="lightbox-img" id="lightbox-img" alt="">
      <button class="lightbox-nav lightbox-prev" id="lightbox-prev" hidden>&#8249;</button>
      <button class="lightbox-nav lightbox-next" id="lightbox-next" hidden>&#8250;</button>
      <button class="lightbox-close" id="lightbox-close" title="关闭">&times;</button>
      <div class="lightbox-counter" id="lightbox-counter"></div>
    </div>
  </div>

  <div class="cart-drawer" id="cart-drawer" hidden>
    <div class="cart-backdrop" id="cart-backdrop"></div>
    <div class="cart-panel">
      <div class="cart-head">
        <h2>我的购物车</h2>
        <button class="cart-close" id="cart-close">&times;</button>
      </div>
      <div class="cart-contact" id="cart-contact"></div>
      <ul class="cart-list" id="cart-list"></ul>
      <div class="cart-empty" id="cart-empty">购物车还是空的</div>
      <div class="cart-foot">
        <div class="cart-actions">
          <button id="btn-clear-cart" class="btn-danger">清除购物车</button>
          <button id="btn-checkout" class="btn-primary">下单</button>
        </div>
        <span class="cart-total">合计：<span id="cart-total">&yen;0</span></span>
      </div>
    </div>
  </div>

  <div class="app-dialog" id="app-dialog" hidden>
    <div class="dialog-backdrop" id="dialog-backdrop"></div>
    <div class="dialog-panel">
      <div class="dialog-title" id="dialog-title"></div>
      <div class="dialog-msg" id="dialog-msg"></div>
      <div class="dialog-actions">
        <button class="dialog-cancel" id="dialog-cancel">取消</button>
        <button class="dialog-ok" id="dialog-ok">确定</button>
      </div>
    </div>
  </div>

  <!-- 满三件优惠弹窗 -->
  <div class="discount-modal" id="discount-modal" hidden>
    <div class="discount-backdrop" id="discount-backdrop"></div>
    <div class="discount-panel">
      <div class="discount-burst"><img src="images/discount-burst.png" alt=""></div>
      <div class="discount-track">
        <div class="dog-roll"><img class="dog-jump" src="images/logo-dog.png" alt="圆球小狗"></div>
      </div>
      <h3 class="discount-title">恭喜触发优惠！</h3>
      <p class="discount-msg">购买三件及以上商品<br>立享 <strong>8 折</strong> 优惠！</p>
      <p class="discount-sub">购物车已自动为您计算优惠价</p>
      <button id="discount-ok">开心收下</button>
    </div>
  </div>

  <footer class="site-footer">
    <div class="container">
      <p id="footer-disclaimer">本站仅作展示</p>
    </div>
  </footer>

  <!-- 悬浮购物车按钮 -->
  <button class="cart-fab" id="cart-fab" aria-label="购物车">
    <svg class="cart-icon" viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z"/>
      <path d="M3 6h18"/>
      <path d="M16 10a4 4 0 0 1-8 0"/>
    </svg>
    <span class="cart-badge" id="cart-badge" hidden>0</span>
  </button>

  <script src="js/app.js" defer></script>
</body>
</html>
